# [project] は PEP 621 準拠の最小構成: requires-python の SSOT のみが目的。
# LAM は package として配布しないため name/version は名目値、dependencies は未記載
# （dependencies 未記載 = pip-audit で監査対象が空 = 事実上のスキップ設計を維持 /
# G5 セキュリティ判定は gitleaks 経由 = pip-audit 独立 / lam-stop-hook.py L416 参照）。
#
# HGA #14 F8 対応: QUICKSTART 3.8+ / 実装 pin 3.11.9 / requires-python 不在の
# 三方向矛盾を requires-python = ">=3.8" で SSOT 化。
[project]
name = "living-architect-model"
version = "0.0.0"
requires-python = ">=3.8"

[tool.pytest.ini_options]
# testpaths: 引数なし `pytest` で `.claude/tests` + `.claude/hooks/tests` を収集する
# (retro-R1 T18 / Stop hook G1 判定と手動実行の振る舞い統一)。
# 注意: `.claude/hooks/analyzers/tests/` はこの testpaths に含まれないため収集対象外
# (2026-08-20 実測: 単独実行で 565 passed / 5 deselected = 壊れているから外れているのではない)。
# 「全 suite」ではない — analyzers 配下は別途明示的に実行する必要がある。
# 両ルートの test basename は一意であること (同名は import file mismatch を起こす / retro-R1 T21 で 2 件 rename 済)
testpaths = [".claude/tests", ".claude/hooks/tests"]
addopts = "--junitxml=.claude/test-results.xml -m 'not e2e_llm and not e2e_convergence'"
markers = [
    "e2e_llm: LLM依存テスト（CI除外）",
    "e2e_convergence: 収束テスト（CI除外・手動実行）",
]
